sonar.organization=rloutrel
sonar.projectKey=rloutrel_gnome-extension-nvme-monitor

sonar.projectName=gnome-extension-nvme-monitor

# Extension sources. Tests are excluded from analysis; bundled icons are data, not code.
sonar.sources=nvme-monitor@rloutrel.github.com
sonar.exclusions=**/test/**,**/icons/**,*.css,*.json,*.svg,*.po,*.pot

sonar.tests=nvme-monitor@rloutrel.github.com/test
sonar.test.inclusions=**/*.test.js

sonar.javascript.lcov.reportPaths=
sonar.coverage.exclusions=**/test/**,**/icons/**,**/*.css,**/*.json,**/*.svg,**/*.po,**/*.pot,setup-polkit.sh

# extension.js imports GJS modules (resource:///org/gnome/shell/...) not resolvable
# by SonarCloud; keep analysis to the pure modules it can reason about.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1488
sonar.issue.ignore.multicriteria.e1.resourceKey=**/extension.js
