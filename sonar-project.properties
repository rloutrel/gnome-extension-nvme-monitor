sonar.organization=romain-loutrel
sonar.projectKey=rloutrel_gnome-extension-nvme-monitor

sonar.projectName=gnome-extension-nvme-monitor

# No exclusions by default; narrow only if noise appears.
sonar.sources=.
sonar.tests=nvme-monitor@rloutrel.github.com/test
sonar.test.inclusions=**/*.test.js
sonar.coverage.exclusions=tools/**,**/test/**
sonar.javascript.lcov.reportPaths=coverage.lcov

# tools/v8ToLcov.js runs in GitHub Actions CI with arguments we control and is
# not exposed to external attackers. The S8707 (path injection) finding is a
# false positive: the output path is join(realpathSync(sourceRoot), 'coverage.lcov')
# with no CLI taint. Suppress the rule for this file only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=tools/v8ToLcov.js
