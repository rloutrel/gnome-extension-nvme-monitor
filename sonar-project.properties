sonar.organization=romain-loutrel
sonar.projectKey=rloutrel_gnome-extension-nvme-monitor

sonar.projectName=gnome-extension-nvme-monitor

# No exclusions by default; narrow only if noise appears.
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=**/*.test.js
# GJS-only modules import gi:// resources and cannot run under plain Node,
# so unit tests cannot cover them. Their logic is deliberately kept in pure
# modules (see AGENTS.md); exclude the GJS shells from coverage metrics.
sonar.coverage.exclusions=**/test/**,.github/**,**/extension.js,**/indicator.js,**/prefs.js,**/subprocess.js,**/logger.js,**/icons.js,**/tempChart.js,**/v2flow.js
sonar.javascript.lcov.reportPaths=lcov.info

# GNOME Shell uses the St toolkit CSS dialect, which extends standard CSS
# with widget-specific properties like icon-size and spacing. These are
# valid in St but unrecognized by SonarCloud's standard CSS validator.
# Suppress the "unknown property" rule for the stylesheet only.
sonar.issue.ignore.multicriteria=css1
sonar.issue.ignore.multicriteria.css1.ruleKey=css:S4651
sonar.issue.ignore.multicriteria.css1.resourceKey=nvme-monitor@rloutrel.github.com/stylesheet.css
