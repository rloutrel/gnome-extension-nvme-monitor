name: Support new device
description: Report an NVMe device that shows as "Unknown", or that behaves oddly despite a supported manufacturer
title: "[Device] "
labels: ["new-device"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping extend device coverage!

        Two cases are handled here:

        - **Unknown device** — the manufacturer is not detected (the menu
          shows a red `!` button next to the drive). The detection pattern
          for this drive is missing.
        - **Supported manufacturer, unexpected behaviour** — missing
          temperature sensors, odd values, mislabelled data. Devices of the
          same manufacturer are *probably* similar, but this is not
          guaranteed: vendor log pages and sensor layouts differ between
          models and firmware generations.

        **In both cases, please provide all the requested information.**
        Even if the manufacturer is already listed as supported in
        [SUPPORTED.md](../SUPPORTED.md), your drive may differ slightly
        from the tested models — the data below lets us add your exact
        drive to the test fixtures.

        **How to get the data:** if the extension's support dialog shows the
        outputs, copy them from there (the copy buttons). Otherwise run
        the commands below in a terminal and paste the full JSON output
        (you may redact serial numbers):

        ```
        nvme list -o json
        sudo nvme smart-log [device_path] -o json
        ```

        **One ticket per device.** If several of your devices are
        affected, please open a separate ticket for each one — each model
        gets its own detection pattern and test fixture.

  - type: input
    id: device-model
    attributes:
      label: Device model
      description: The `ModelNumber` from `nvme list -o json` (or the drive label). One device per ticket.
      placeholder: e.g. "SAMSUNG MZVL2512HCJQ-00B00"
    validations:
      required: true

  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      description: The real manufacturer, as printed on the drive or its datasheet.
      placeholder: e.g. "Corsair"
    validations:
      required: true

  - type: dropdown
    id: case
    attributes:
      label: Case
      options:
        - Unknown manufacturer (red "!" shown in the menu)
        - Supported manufacturer, but behaviour looks wrong
    validations:
      required: true

  - type: textarea
    id: smart-log
    attributes:
      label: "Output of `sudo nvme smart-log [device_path] -o json`"
      description: Full JSON output, copied from the extension's support dialog or from the command. This is the key data needed to add or verify support.
      render: json
      placeholder: |
        {
          "critical_warning": 0,
          "temperature": 317,
          "avail_spare": 100,
          "spare_thresh": 10,
          "percent_used": 0,
          ...
        }
    validations:
      required: true

  - type: textarea
    id: device-list
    attributes:
      label: "Output of `nvme list -o json`"
      description: Confirms the `ModelNumber` string used for detection. Copy it from the extension's support dialog or run the command. You may redact the serial number.
      render: json
    validations:
      required: true

  - type: input
    id: nvme-cli-version
    attributes:
      label: nvme-cli version
      description: Output of `nvme version`.
      placeholder: e.g. "nvme-cli 2.11"
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What the extension shows vs. what you expected (e.g. missing sensors, wrong labels).
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Anything else useful — datasheet sensor mapping, vendor tooling quirks, etc.
    validations:
      required: false
