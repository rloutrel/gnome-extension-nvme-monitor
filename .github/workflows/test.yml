name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: |
          find "nvme-monitor@rloutrel.github.com" -name "*.js" -not -path "*/test/*" -print0 | xargs -0 -n1 node --check
      - name: Shell lint
        run: shellcheck "nvme-monitor@rloutrel.github.com/setup-polkit.sh"
      - name: Validate metadata
        run: node "nvme-monitor@rloutrel.github.com/test/validateMetadata.js"
      - name: Unit tests
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include="nvme-monitor@rloutrel.github.com/**/*.js" \
            --test-coverage-exclude="**/test/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            "nvme-monitor@rloutrel.github.com/test/"*.test.js
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
