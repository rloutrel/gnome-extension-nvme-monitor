name: sonarcloud

on:
  push:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate coverage
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include="nvme-monitor@rloutrel.github.com/**/*.js" \
            --test-coverage-exclude="**/test/**" \
            --test-reporter=lcov \
            --test-reporter-destination=lcov.info \
            "nvme-monitor@rloutrel.github.com/test/"*.test.js
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
